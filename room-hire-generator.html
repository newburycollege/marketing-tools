
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Room Hire Email Generator</title>
  <link rel="stylesheet" href="css/gds-theme.css" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32x32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="favicon-16x16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
</head>

<body data-app-key="room-hire" data-app-title="Room Hire Email Generator" data-app-intro="Generate a booking link and ready-to-send email for room hire agreements.">

  <div id="app-shell"><p class="app-note">Loading Marketing Tools… If this message persists, refresh the page or contact Marketing.</p></div><noscript><p>This toolkit requires JavaScript to run.</p></noscript>

  <template id="app-page-content">
    <section class="app-form">
      <h2 class="app-section-title">Create room hire link</h2>
      <p class="page-description">Enter the booking reference, rate and rate unit to generate a room hire agreement link and email text.</p>

      <div class="form-group">
        <label for="bookingRef">Booking reference</label>
        <input type="text" id="bookingRef" />
      </div>

      <div class="form-group">
        <label for="rate">Rate</label>
        <input type="text" id="rate" inputmode="decimal" pattern="[0-9]*[.]?[0-9]*" />
      </div>

      <div class="form-group">
        <label for="rateUnit">Rate unit</label>
        <select id="rateUnit" class="app-select">
          <option value="per hour">Per hour</option>
          <option value="fixed rate">Fixed rate</option>
        </select>
      </div>

      <div class="app-button-row">
        <button type="button" id="generateBtn">Generate</button>
        <button type="button" class="btn-secondary" id="copyLinkBtn" disabled>Copy link</button>
      </div>
    </section>

    <p id="roomStatus" role="status" class="status-text"></p>
    <section class="app-card">
      <h2 class="app-section-title">Generated link</h2>
      <textarea id="urlOutput" aria-label="Generated link" class="app-textarea" rows="4" readonly></textarea>
    </section>

    <section class="app-card">
      <h2 class="app-section-title">Email content</h2>
      <textarea id="emailOutput" aria-label="Email content" class="app-textarea" rows="6" readonly></textarea>
      <div class="app-button-row">
        <button type="button" id="copyEmail" disabled class="btn-secondary">Copy email</button>
      </div>
    </section>
  </template>

  <script src="js/shared-utils.js"></script>
  <script src="js/gds-shell.js"></script>

  <script src="js/room-hire-generator.js"></script>

</body>
</html>
