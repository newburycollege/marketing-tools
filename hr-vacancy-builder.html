<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HR Vacancy Builder</title>
  <link rel="stylesheet" href="css/gds-theme.css" />
  <style>
    .vacancy-builder-layout {
      display: grid;
      grid-template-columns: minmax(320px, 520px) minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }
    .vacancy-builder-preview-wrap {
      background: #ffffff;
      border: 1px solid var(--gds-border-light);
      box-shadow: var(--gds-shadow);
      padding: 16px;
    }
    #vacancyPreviewCanvas {
      display: block;
      width: 100%;
      max-width: 540px;
      aspect-ratio: 1 / 1;
      background: #e6e6e6;
      margin: 0 auto;
      border: 1px solid var(--gds-border-light);
    }
    .vacancy-slider-value {
      color: var(--gds-secondary-text);
      font-size: 0.95rem;
      margin-top: 4px;
    }
    .vacancy-builder-output-grid {
      display: grid;
      gap: 16px;
    }
    .vacancy-builder-output-card {
      border: 1px solid var(--gds-border-light);
      background: #ffffff;
      padding: 16px;
    }
    .vacancy-builder-headline-preview {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0 0 16px;
      color: var(--gds-text);
    }
    @media (max-width: 980px) {
      .vacancy-builder-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body data-app-key="hr-vacancy-builder" data-app-title="HR Vacancy Builder" data-app-intro="Create a 1080 × 1080 HR vacancy image with dynamically generated graphics and job details.">
  <div id="app-shell"></div>

  <template id="app-page-content">
    <div class="app-note">
      Upload a background image and fill in the job details. The vacancy graphic will be dynamically generated with a red section containing the job title and details with icons.
    </div>

    <div class="vacancy-builder-layout">
      <section class="app-form" aria-labelledby="vacancy-image-title">
        <h2 id="vacancy-image-title" class="app-section-title">Image setup</h2>

        <div class="form-group">
          <label for="backgroundImage">Background image</label>
          <p class="hint-text">Upload a photo. It will be cropped to a square automatically.</p>
          <input type="file" id="backgroundImage" accept="image/*" />
        </div>

        <div class="app-grid app-grid--two">
          <div class="form-group">
            <label for="zoomRange">Zoom</label>
            <input type="range" id="zoomRange" min="1" max="3" step="0.01" value="1" />
            <div class="vacancy-slider-value" id="zoomValue">1.00×</div>
          </div>
          <div class="form-group">
            <label for="outputSize">Output size</label>
            <input type="text" id="outputSize" value="1080 × 1080" readonly />
          </div>
        </div>

        <div class="app-grid app-grid--two">
          <div class="form-group">
            <label for="xRange">Horizontal position</label>
            <input type="range" id="xRange" min="-100" max="100" step="1" value="0" />
            <div class="vacancy-slider-value" id="xValue">0</div>
          </div>
          <div class="form-group">
            <label for="yRange">Vertical position</label>
            <input type="range" id="yRange" min="-100" max="100" step="1" value="0" />
            <div class="vacancy-slider-value" id="yValue">0</div>
          </div>
        </div>

        <div class="app-button-row">
          <button type="button" id="downloadImageButton" disabled>Download image</button>
          <button type="button" class="btn-secondary" id="resetCropButton">Reset crop</button>
        </div>
        <p class="status-text" id="imageStatus">Upload a background image to begin.</p>
      </section>

      <section class="app-card">
        <h2 class="app-section-title">Preview</h2>
        <div class="vacancy-builder-preview-wrap">
          <canvas id="vacancyPreviewCanvas" width="1080" height="1080"></canvas>
        </div>
      </section>
    </div>

    <section class="app-form" aria-labelledby="vacancy-details-title" style="margin-top:24px;">
      <h2 id="vacancy-details-title" class="app-section-title">Vacancy details</h2>

      <div class="app-grid app-grid--two">
        <div class="form-group">
          <label for="jobTitle">Job title</label>
       
          <input type="text" id="jobTitle" placeholder="For example, Head of Side Quests" />
          <p class="error-message" id="jobTitleError"></p>
        </div>
        <div class="form-group">
          <label for="location">Location</label>
          <input type="text" id="location" placeholder="For example, Newbury, Berkshire" />
        </div>
      </div>

      <div class="app-grid app-grid--two">
        <div class="form-group">
          <label for="employmentType">Employment type</label>
          <select id="employmentType">
            <option value="">Select employment type</option>
            <option>Full-time, permanent</option>
            <option>Full-time, fixed term</option>
            <option>Full-time, temporary</option>
            <option>Full-time, term-time only</option>
            <option>Part-time, permanent</option>
            <option>Part-time, fixed term</option>
            <option>Part-time, temporary</option>
            <option>Part-time, term-time only</option>
            <option>Part-time, sessional</option>
            <option>Variable hours, permanent</option>
            <option>Variable hours, fixed term</option>
            <option>Hourly paid</option>
            <option>Casual or bank</option>
            <option>Supply or relief</option>
            <option>Apprenticeship</option>
            <option>Internship or placement</option>
            <option>Secondment</option>
            <option>Maternity cover</option>
            <option>Voluntary</option>
            <option>Other or flexible arrangement</option>
          </select>
        </div>
        <div class="form-group">
          <label for="salary">Salary</label>
         
          <input
            type="number"
            id="salary"
            min="0"
            step="0.01"
            inputmode="decimal"
            placeholder="Enter numbers only"
            aria-describedby="salaryHint"
          />

          <div class="vacancy-salary-controls">
            <fieldset class="vacancy-toggle-fieldset">
              <legend>Payment basis</legend>
              <div class="vacancy-toggle-group">
                <label class="vacancy-toggle-option">
                  <input type="radio" name="salaryPeriod" value="annum" checked />
                  <span>Per annum</span>
                </label>
                <label class="vacancy-toggle-option">
                  <input type="radio" name="salaryPeriod" value="hour" />
                  <span>Per hour</span>
                </label>
              </div>
            </fieldset>

            <fieldset class="vacancy-toggle-fieldset">
              <legend>Adjustment</legend>
              <div class="vacancy-toggle-group">
                <label class="vacancy-toggle-option">
                  <input type="checkbox" id="salaryProRata" />
                  <span>Pro-rata</span>
                </label>
              </div>
            </fieldset>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="closingDate">Closing date</label>
        <p class="hint-text">Choose a date. It will appear on the image as DD MMM YYYY.</p>
        <input type="date" id="closingDate" />
      </div>

      <div class="app-button-row">
        <button type="button" id="updatePreviewButton">Update preview</button>
        <button type="button" class="btn-secondary" id="clearDetailsButton">Clear fields</button>
      </div>
      <p class="status-text" id="detailsStatus">Fill in the job details and click Update preview.</p>
    </section>
  </template>

  <script src="js/gds-shell.js"></script>
  <script>
    (function () {
      const OUTPUT_SIZE = 1080;
      const RED_SECTION_HEIGHT_RATIO = 0.397;
      const RED_SECTION_CORNER_RADIUS = 54;
      const ICON_SIZE = 48;
      const TEXT_MARGIN_LEFT = 78;
      const TEXT_COLOR = '#ffffff';
      const RED_COLOR = '#F42941';
      const DARK_BADGE_COLOR = '#262626';

      function boot() {
        const canvas = document.getElementById('vacancyPreviewCanvas');
        const backgroundInput = document.getElementById('backgroundImage');
        if (!canvas || !backgroundInput) {
          window.requestAnimationFrame(boot);
          return;
        }

        if (canvas.dataset.initialised === 'true') {
          return;
        }
        canvas.dataset.initialised = 'true';

        const previewCtx = canvas.getContext('2d');
        const zoomRange = document.getElementById('zoomRange');
        const xRange = document.getElementById('xRange');
        const yRange = document.getElementById('yRange');
        const zoomValue = document.getElementById('zoomValue');
        const xValue = document.getElementById('xValue');
        const yValue = document.getElementById('yValue');
        const imageStatus = document.getElementById('imageStatus');
        const downloadImageButton = document.getElementById('downloadImageButton');
        const resetCropButton = document.getElementById('resetCropButton');
        const updatePreviewButton = document.getElementById('updatePreviewButton');
        const clearDetailsButton = document.getElementById('clearDetailsButton');
        const detailsStatus = document.getElementById('detailsStatus');

        let backgroundImage = null;

        function updateSliderLabels() {
          zoomValue.textContent = Number(zoomRange.value).toFixed(2) + '×';
          xValue.textContent = xRange.value;
          yValue.textContent = yRange.value;
        }

        function roundedRectPath(ctx, x, y, width, height, radius) {
          const safeRadius = Math.min(radius, width / 2, height / 2);
          ctx.beginPath();
          ctx.moveTo(x + safeRadius, y);
          ctx.lineTo(x + width - safeRadius, y);
          ctx.quadraticCurveTo(x + width, y, x + width, y + safeRadius);
          ctx.lineTo(x + width, y + height - safeRadius);
          ctx.quadraticCurveTo(x + width, y + height, x + width - safeRadius, y + height);
          ctx.lineTo(x + safeRadius, y + height);
          ctx.quadraticCurveTo(x, y + height, x, y + height - safeRadius);
          ctx.lineTo(x, y + safeRadius);
          ctx.quadraticCurveTo(x, y, x + safeRadius, y);
          ctx.closePath();
        }

        function drawRedSection(ctx, yStart) {
          ctx.fillStyle = RED_COLOR;
          ctx.beginPath();
          ctx.moveTo(0, OUTPUT_SIZE);
          ctx.lineTo(0, yStart + RED_SECTION_CORNER_RADIUS);
          ctx.quadraticCurveTo(0, yStart, RED_SECTION_CORNER_RADIUS, yStart);
          ctx.lineTo(OUTPUT_SIZE - RED_SECTION_CORNER_RADIUS, yStart);
          ctx.quadraticCurveTo(OUTPUT_SIZE, yStart, OUTPUT_SIZE, yStart + RED_SECTION_CORNER_RADIUS);
          ctx.lineTo(OUTPUT_SIZE, OUTPUT_SIZE);
          ctx.closePath();
          ctx.fill();
        }

        function drawVacancyBadge(ctx, yStart) {
          const badgeY = yStart - 29;
          const badgeX = 97;
          const badgeWidth = 277;
          const badgeHeight = 71;
          const badgeRadius = badgeHeight / 2;

          ctx.fillStyle = DARK_BADGE_COLOR;
          roundedRectPath(ctx, badgeX, badgeY, badgeWidth, badgeHeight, badgeRadius);
          ctx.fill();

          ctx.fillStyle = TEXT_COLOR;
          ctx.font = 'bold 44px Arial, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('VACANCY', badgeX + badgeWidth / 2, badgeY + badgeHeight / 2 + 6);
        }

        function wrapText(ctx, text, maxWidth) {
          const words = text.split(/\s+/).filter(Boolean);
          const lines = [];
          let line = '';

          words.forEach(function (word) {
            const testLine = line ? line + ' ' + word : word;
            if (ctx.measureText(testLine).width > maxWidth && line) {
              lines.push(line);
              line = word;
            } else {
              line = testLine;
            }
          });

          if (line) {
            lines.push(line);
          }
          return lines;
        }

        function fitTextWithEllipsis(ctx, text, maxWidth) {
          if (ctx.measureText(text).width <= maxWidth) {
            return text;
          }

          let shortened = text;
          while (shortened.length > 1 && ctx.measureText(shortened + '…').width > maxWidth) {
            shortened = shortened.slice(0, -1).trimEnd();
          }
          return shortened + '…';
        }

        function getJobTitleLayout(ctx, jobTitle, maxWidth, maxHeight) {
          const minimumFontSize = 44;

          for (let fontSize = 92; fontSize >= minimumFontSize; fontSize -= 2) {
            const lineHeight = Math.round(fontSize * 1.08);
            ctx.font = 'bold ' + fontSize + 'px Arial, sans-serif';
            const lines = wrapText(ctx, jobTitle, maxWidth);
            const widestLine = lines.reduce(function (widest, line) {
              return Math.max(widest, ctx.measureText(line).width);
            }, 0);

            if (lines.length <= 2 && widestLine <= maxWidth && (lines.length * lineHeight) <= maxHeight) {
              return { fontSize: fontSize, lineHeight: lineHeight, lines: lines };
            }
          }

          ctx.font = 'bold ' + minimumFontSize + 'px Arial, sans-serif';
          const fallbackLines = wrapText(ctx, jobTitle, maxWidth);
          const firstLine = fallbackLines[0] || '';
          const remainingText = fallbackLines.slice(1).join(' ');
          return {
            fontSize: minimumFontSize,
            lineHeight: Math.round(minimumFontSize * 1.08),
            lines: [
              fitTextWithEllipsis(ctx, firstLine, maxWidth),
              fitTextWithEllipsis(ctx, remainingText, maxWidth)
            ].filter(Boolean)
          };
        }

        function drawJobTitle(ctx, yStart, jobTitle) {
          const titleX = 108;
          const titleY = yStart + 82;
          const maxWidth = OUTPUT_SIZE - titleX - 90;
          const maxHeight = 144;
          const layout = getJobTitleLayout(ctx, jobTitle, maxWidth, maxHeight);

          ctx.fillStyle = TEXT_COLOR;
          ctx.font = 'bold ' + layout.fontSize + 'px Arial, sans-serif';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'top';

          layout.lines.forEach(function (line, index) {
            ctx.fillText(line, titleX, titleY + (index * layout.lineHeight));
          });
        }

        function drawIcon(ctx, iconName, x, y) {
          const scale = ICON_SIZE / 32;
          ctx.save();
          ctx.translate(x, y);
          ctx.scale(scale, scale);
          ctx.strokeStyle = TEXT_COLOR;
          ctx.lineWidth = 2;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          if (iconName === 'pin') {
            ctx.beginPath();
            ctx.moveTo(16, 31);
            ctx.bezierCurveTo(12, 26, 5, 20, 5, 12);
            ctx.bezierCurveTo(5, 6.5, 10, 2, 16, 2);
            ctx.bezierCurveTo(22, 2, 27, 6.5, 27, 12);
            ctx.bezierCurveTo(27, 20, 20, 26, 16, 31);
            ctx.closePath();
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(16, 13, 4, 0, Math.PI * 2);
            ctx.stroke();
          } else if (iconName === 'clock') {
            ctx.beginPath();
            ctx.arc(16, 16, 14, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(16, 8);
            ctx.lineTo(16, 16);
            ctx.lineTo(22, 20);
            ctx.stroke();
          } else if (iconName === 'money') {
            const frontNoteOffsetX = -1 / scale;
            const frontNoteCentreX = 14 + frontNoteOffsetX;

            roundedRectPath(ctx, frontNoteOffsetX, 7, 28, 19, 4);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(7, 4);
            ctx.lineTo(25, 4);
            ctx.quadraticCurveTo(30, 4, 30, 9);
            ctx.lineTo(30, 22);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(frontNoteCentreX, 16.5, 4, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(6 + frontNoteOffsetX, 13);
            ctx.lineTo(6 + frontNoteOffsetX, 20);
            ctx.moveTo(22 + frontNoteOffsetX, 13);
            ctx.lineTo(22 + frontNoteOffsetX, 20);
            ctx.stroke();
          } else if (iconName === 'calendar') {
            roundedRectPath(ctx, 3, 5, 26, 24, 4);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(4, 12);
            ctx.lineTo(28, 12);
            ctx.moveTo(10, 2);
            ctx.lineTo(10, 8);
            ctx.moveTo(22, 2);
            ctx.lineTo(22, 8);
            ctx.stroke();
            [10, 16, 22].forEach(function (dotX) {
              [17, 23].forEach(function (dotY) {
                ctx.beginPath();
                ctx.arc(dotX, dotY, 1, 0, Math.PI * 2);
                ctx.fillStyle = TEXT_COLOR;
                ctx.fill();
              });
            });
          }

          ctx.restore();
        }

        function drawDetailItem(ctx, x, y, iconName, text, maxTextWidth) {
          drawIcon(ctx, iconName, x, y);
          ctx.fillStyle = TEXT_COLOR;
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';

          let fontSize = 38;
          const minimumFontSize = 20;
          while (fontSize > minimumFontSize) {
            ctx.font = fontSize + 'px Arial, sans-serif';
            if (ctx.measureText(text).width <= maxTextWidth) {
              break;
            }
            fontSize -= 1;
          }
          ctx.font = fontSize + 'px Arial, sans-serif';

          ctx.fillText(
            fitTextWithEllipsis(ctx, text, maxTextWidth),
            x + TEXT_MARGIN_LEFT,
            y + ICON_SIZE / 2
          );
        }

        function formatClosingDate(value) {
          const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
          if (!match) {
            return '';
          }

          const date = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
          return new Intl.DateTimeFormat('en-GB', {
            day: '2-digit',
            month: 'short',
            year: 'numeric'
          }).format(date);
        }

        function formatSalary() {
          const salaryValue = document.getElementById('salary').value;
          const amount = Number(salaryValue);
          if (!salaryValue || !Number.isFinite(amount) || amount < 0) {
            return '';
          }

          const selectedPeriod = document.querySelector('input[name="salaryPeriod"]:checked');
          const period = selectedPeriod ? selectedPeriod.value : 'annum';
          const fractionDigits = period === 'hour' || !Number.isInteger(amount) ? 2 : 0;
          const formattedAmount = new Intl.NumberFormat('en-GB', {
            minimumFractionDigits: fractionDigits,
            maximumFractionDigits: 2
          }).format(amount);
          let salaryText = '£' + formattedAmount + (period === 'hour' ? '/hour' : ' p.a.');

          if (document.getElementById('salaryProRata').checked) {
            salaryText += ', pro-rata';
          }
          return salaryText;
        }

        function drawJobDetails(ctx, yStart) {
          const location = document.getElementById('location').value.trim();
          const employmentType = document.getElementById('employmentType').value.trim();
          const salary = formatSalary();
          const closingDate = formatClosingDate(document.getElementById('closingDate').value);

          const leftX = 100;
          const rightX = 559;
          const firstRowY = yStart + 238;
          const secondRowY = firstRowY + 90;
          const leftTextWidth = rightX - (leftX + TEXT_MARGIN_LEFT) - 8;
          const rightTextWidth = OUTPUT_SIZE - (rightX + TEXT_MARGIN_LEFT) - 42;

          if (location) {
            drawDetailItem(ctx, leftX, firstRowY, 'pin', location, leftTextWidth);
          }

          if (employmentType) {
            drawDetailItem(ctx, rightX, firstRowY, 'clock', employmentType, rightTextWidth);
          }

          if (salary) {
            drawDetailItem(ctx, leftX, secondRowY, 'money', salary, leftTextWidth);
          }

          if (closingDate) {
            drawDetailItem(
              ctx,
              rightX,
              secondRowY,
              'calendar',
              'Closes ' + closingDate,
              rightTextWidth
            );
          }
        }

        function drawPreview() {
          previewCtx.clearRect(0, 0, OUTPUT_SIZE, OUTPUT_SIZE);
          previewCtx.fillStyle = '#e6e6e6';
          previewCtx.fillRect(0, 0, OUTPUT_SIZE, OUTPUT_SIZE);

          if (!backgroundImage) {
            imageStatus.textContent = 'Upload a background image to begin.';
            downloadImageButton.disabled = true;
            return;
          }

          const zoom = Number(zoomRange.value);
          const xOffset = Number(xRange.value) / 100;
          const yOffset = Number(yRange.value) / 100;

          const coverScale = Math.max(OUTPUT_SIZE / backgroundImage.width, OUTPUT_SIZE / backgroundImage.height);
          const scale = coverScale * zoom;
          const drawWidth = backgroundImage.width * scale;
          const drawHeight = backgroundImage.height * scale;
          const maxOffset = OUTPUT_SIZE * 0.5;
          const drawX = ((OUTPUT_SIZE - drawWidth) / 2) + (xOffset * maxOffset);
          const drawY = ((OUTPUT_SIZE - drawHeight) / 2) + (yOffset * maxOffset);

          previewCtx.drawImage(backgroundImage, drawX, drawY, drawWidth, drawHeight);

          const jobTitle = document.getElementById('jobTitle').value.trim();
          if (jobTitle) {
            const redSectionY = OUTPUT_SIZE * (1 - RED_SECTION_HEIGHT_RATIO);
            drawRedSection(previewCtx, redSectionY);
            drawVacancyBadge(previewCtx, redSectionY);
            drawJobTitle(previewCtx, redSectionY, jobTitle);
            drawJobDetails(previewCtx, redSectionY);
            imageStatus.textContent = 'Preview updated with job details.';
          } else {
            imageStatus.textContent = 'Enter a job title to see the vacancy overlay.';
          }

          downloadImageButton.disabled = false;
        }

        function loadImageFromFile(file, callback) {
          if (!file) return;
          const reader = new FileReader();
          reader.onload = function (event) {
            const img = new Image();
            img.onload = function () { callback(img); };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        }

        function buildExportCanvas() {
          const offscreen = document.createElement('canvas');
          offscreen.width = OUTPUT_SIZE;
          offscreen.height = OUTPUT_SIZE;
          const ctx = offscreen.getContext('2d');

          ctx.fillStyle = '#e6e6e6';
          ctx.fillRect(0, 0, OUTPUT_SIZE, OUTPUT_SIZE);

          if (backgroundImage) {
            const zoom = Number(zoomRange.value);
            const xOffset = Number(xRange.value) / 100;
            const yOffset = Number(yRange.value) / 100;
            const coverScale = Math.max(OUTPUT_SIZE / backgroundImage.width, OUTPUT_SIZE / backgroundImage.height);
            const scale = coverScale * zoom;
            const drawWidth = backgroundImage.width * scale;
            const drawHeight = backgroundImage.height * scale;
            const maxOffset = OUTPUT_SIZE * 0.5;
            const drawX = ((OUTPUT_SIZE - drawWidth) / 2) + (xOffset * maxOffset);
            const drawY = ((OUTPUT_SIZE - drawHeight) / 2) + (yOffset * maxOffset);
            ctx.drawImage(backgroundImage, drawX, drawY, drawWidth, drawHeight);
          }

          const jobTitle = document.getElementById('jobTitle').value.trim();
          if (jobTitle) {
            const redSectionY = OUTPUT_SIZE * (1 - RED_SECTION_HEIGHT_RATIO);
            drawRedSection(ctx, redSectionY);
            drawVacancyBadge(ctx, redSectionY);
            drawJobTitle(ctx, redSectionY, jobTitle);
            drawJobDetails(ctx, redSectionY);
          }

          return offscreen;
        }

        async function downloadCanvasAsPng() {
          if (!backgroundImage) {
            imageStatus.textContent = 'No image available to download.';
            return;
          }

          const jobTitleValue = document.getElementById('jobTitle').value.trim();
          const safeName = (jobTitleValue || 'hr-vacancy')
            .toLowerCase()
            .replace(/\s+/g, '-')
            .replace(/[^a-z0-9-]/g, '');
          const fileName = safeName + '-1080x1080.png';

          try {
            const exportCanvas = buildExportCanvas();

            const triggerDownload = function (url, isObjectUrl) {
              const link = document.createElement('a');
              link.href = url;
              link.download = fileName;
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
              if (isObjectUrl) {
                setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
              }
              imageStatus.textContent = '1080 × 1080 image download started.';
            };

            if (exportCanvas.toBlob) {
              exportCanvas.toBlob(function (blob) {
                if (!blob) {
                  imageStatus.textContent = 'Download failed. Please try again.';
                  return;
                }
                if (window.navigator.msSaveOrOpenBlob) {
                  window.navigator.msSaveOrOpenBlob(blob, fileName);
                  imageStatus.textContent = '1080 × 1080 image download started.';
                  return;
                }
                triggerDownload(URL.createObjectURL(blob), true);
              }, 'image/png');
            } else {
              triggerDownload(exportCanvas.toDataURL('image/png'), false);
            }
          } catch (error) {
            console.error(error);
            imageStatus.textContent = 'Download failed: ' + error.message;
          }
        }

        backgroundInput.addEventListener('change', function () {
          loadImageFromFile(backgroundInput.files[0], function (img) {
            backgroundImage = img;
            drawPreview();
          });
        });

        [zoomRange, xRange, yRange].forEach(function (control) {
          control.addEventListener('input', function () {
            updateSliderLabels();
            drawPreview();
          });
        });

        resetCropButton.addEventListener('click', function () {
          zoomRange.value = '1';
          xRange.value = '0';
          yRange.value = '0';
          updateSliderLabels();
          drawPreview();
        });

        downloadImageButton.addEventListener('click', downloadCanvasAsPng);

        updatePreviewButton.addEventListener('click', function () {
          drawPreview();
          detailsStatus.textContent = 'Preview updated with your details.';
        });

        clearDetailsButton.addEventListener('click', function () {
          ['jobTitle', 'location', 'employmentType', 'salary', 'closingDate'].forEach(function (id) {
            document.getElementById(id).value = '';
          });
          document.querySelector('input[name="salaryPeriod"][value="annum"]').checked = true;
          document.getElementById('salaryProRata').checked = false;
          document.getElementById('jobTitleError').textContent = '';
          detailsStatus.textContent = 'Fields cleared.';
          drawPreview();
        });

        updateSliderLabels();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>
