<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Marketing tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css" />
  <link rel="stylesheet" href="css/gds-theme.css" />
</head>
<body data-app-key="home" data-app-title="Marketing tools" data-app-intro="A suite of digital tools to support Newbury College marketing functions.">
  <div id="app-shell"></div>

  <template id="app-page-content">
   <div class="app-note">
     These tools are here to help Newbury College staff complete common marketing tasks quickly and easily.
   </div>

   <h2 class="app-drawer-title">Available Tools</h2>
   <div class="app-drawer">
     <a class="app-drawer-item" href="qr.html">
       <i class="app-drawer-item__icon fas fa-qrcode"></i>
       <h3 class="app-drawer-item__title">QR Code Generator</h3>
       <p class="app-drawer-item__description">Create a QR code from text or a URL, then download it as a PNG.</p>
     </a>
     <a class="app-drawer-item" href="resize.html">
       <i class="app-drawer-item__icon fas fa-images"></i>
       <h3 class="app-drawer-item__title">Image Resizer</h3>
       <p class="app-drawer-item__description">Upload one image and generate the required marketing image sizes in one go.</p>
     </a>
     <a class="app-drawer-item" href="utm-builder.html">
       <i class="app-drawer-item__icon fas fa-bullhorn"></i>
       <h3 class="app-drawer-item__title">UTM Link Builder</h3>
       <p class="app-drawer-item__description">Create consistent tracked links for campaigns, emails, social posts, QR codes and other marketing activity.</p>
     </a>
     <a class="app-drawer-item" href="vacancy-post-builder.html">
       <i class="app-drawer-item__icon fas fa-bolt"></i>
       <h3 class="app-drawer-item__title">Apprenticeship Vacancy Builder</h3>
       <p class="app-drawer-item__description">Create a 1080 × 1080 vacancy graphic with the standard overlay and generate standardised social copy.</p>
     </a>
     <a class="app-drawer-item" href="room-hire-generator.html">
       <i class="app-drawer-item__icon fas fa-person-shelter"></i>
       <h3 class="app-drawer-item__title">Room Hire Email Generator</h3>
       <p class="app-drawer-item__description">Create a room hire agreement link and ready-to-send email text.</p>
     </a>
   </div>

   <h2 class="app-drawer-title">External Platforms</h2>
   <div class="app-drawer">
     <a class="app-drawer-item" href="https://newburycollege.marketingautomation.services/" target="_blank" rel="noopener noreferrer">
       <i class="app-drawer-item__icon fas fa-envelopes-bulk"></i>
       <h3 class="app-drawer-item__title">Constant Contact</h3>
       <p class="app-drawer-item__description">Email marketing and automation platform.</p>
     </a>
     <a class="app-drawer-item" href="https://flare-cms.pixelnebula.com/login" target="_blank" rel="noopener noreferrer">
       <i class="app-drawer-item__icon fas fa-tv"></i>
       <h3 class="app-drawer-item__title">Flare CMS</h3>
       <p class="app-drawer-item__description">Content management system for digital media.</p>
     </a>
     <a class="app-drawer-item" href="https://app.short.io" target="_blank" rel="noopener noreferrer">
       <i class="app-drawer-item__icon fas fa-link"></i>
       <h3 class="app-drawer-item__title">Short.io</h3>
       <p class="app-drawer-item__description">URL shortener and link management tool.</p>
     </a>
     <a class="app-drawer-item" href="https://www.newbury-college.ac.uk/administrator" target="_blank" rel="noopener noreferrer">
       <i class="app-drawer-item__icon fab fa-joomla"></i>
       <h3 class="app-drawer-item__title">Website Admin</h3>
       <p class="app-drawer-item__description">Joomla administration panel for website management.</p>
     </a>
   </div>
  </template>

  <script src="js/gds-shell.js"></script>
</body>
</html>
