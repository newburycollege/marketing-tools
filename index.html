<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Marketing tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css" />
  <link rel="stylesheet" href="css/gds-theme.css" />
</head>
<body data-app-key="home" data-app-title="Marketing tools" data-app-intro="A suite of digital tools to support Newbury College marketing functions.">
  <div id="app-shell"></div>

  <template id="app-page-content">
    <div class="app-note">
      These tools are here to help Newbury College staff complete common marketing tasks quickly and easily.
    </div>

    <div class="app-grid app-grid--two">
      <section class="app-card">
        <h2 class="app-section-title">Available tools</h2>
        <p class="app-body-intro">Choose a tool below.</p>
        <ul class="tool-list">
          <li>
            <a class="tool-link" href="qr.html">
              <i class="tool-link__icon fas fa-qrcode"></i>
              <div class="tool-link__content">
                <span class="tool-link__title">QR Code Generator</span>
                <span class="tool-link__description">Create a QR code from text or a URL, then download it as a PNG.</span>
              </div>
            </a>
          </li>
          <li>
            <a class="tool-link" href="resize.html">
              <i class="tool-link__icon fas fa-images"></i>
              <div class="tool-link__content">
                <span class="tool-link__title">Image Resizer</span>
                <span class="tool-link__description">Upload one image and generate the required marketing image sizes in one go.</span>
              </div>
            </a>
          </li>
          <li>
            <a class="tool-link" href="utm-builder.html">
              <i class="tool-link__icon fas fa-bullhorn"></i>
              <div class="tool-link__content">
                <span class="tool-link__title">UTM Link Builder</span>
                <span class="tool-link__description">Create consistent tracked links for campaigns, emails, social posts, QR codes and other marketing activity.</span>
              </div>
            </a>
          </li>
          <li>
            <a class="tool-link" href="vacancy-post-builder.html">
              <i class="tool-link__icon fas fa-bolt"></i>
              <div class="tool-link__content">
                <span class="tool-link__title">Apprenticeship Vacancy Builder</span>
                <span class="tool-link__description">Create a 1080 × 1080 vacancy graphic with the standard overlay and generate standardised social copy.</span>
              </div>
            </a>
          </li>
          <li>
            <a class="tool-link" href="room-hire-generator.html">
              <i class="tool-link__icon fas fa-person-shelter"></i>
              <div class="tool-link__content">
                <span class="tool-link__title">Room Hire Email Generator</span>
                <span class="tool-link__description">Create a room hire agreement link and ready-to-send email text.</span>
              </div>
            </a>
          </li>
        </ul>
      </section>

      <section class="app-card">
        <h2 class="app-section-title">Need another tool?</h2>
        <p class="app-body-intro">More useful tools may be added over time to support day-to-day marketing activity.</p>
        <p>If there is a task that could be made easier with a simple tool, please contact <a href="mailto:marketing@newbury-college.ac.uk">Marketing</a>.</p>
      </section>
    </div>

    <div class="app-grid app-grid--full">
      <section class="app-card">
        <h2 class="app-section-title">External Platforms</h2>
        <p class="app-body-intro">Quick access to common external services.</p>
        <ul class="tool-list">
          <li>
            <a class="tool-link" href="https://newburycollege.marketingautomation.services/" target="_blank" rel="noopener noreferrer">
              <i class="tool-link__icon fas fa-envelopes-bulk"></i>
              <div class="tool-link__content">
                <span class="tool-link__title">Constant Contact</span>
                <span class="tool-link__description">Email marketing and automation platform.</span>
              </div>
            </a>
          </li>
          <li>
            <a class="tool-link" href="https://flare-cms.pixelnebula.com/login" target="_blank" rel="noopener noreferrer">
              <i class="tool-link__icon fas fa-tv"></i>
              <div class="tool-link__content">
                <span class="tool-link__title">Flare CMS</span>
                <span class="tool-link__description">Content management system for digital media.</span>
              </div>
            </a>
          </li>
          <li>
            <a class="tool-link" href="https://app.short.io" target="_blank" rel="noopener noreferrer">
              <i class="tool-link__icon fas fa-link"></i>
              <div class="tool-link__content">
                <span class="tool-link__title">Short.io</span>
                <span class="tool-link__description">URL shortener and link management tool.</span>
              </div>
            </a>
          </li>
          <li>
            <a class="tool-link" href="https://www.newbury-college.ac.uk/administrator" target="_blank" rel="noopener noreferrer">
              <i class="tool-link__icon fab fa-joomla"></i>
              <div class="tool-link__content">
                <span class="tool-link__title">Website Admin</span>
                <span class="tool-link__description">Joomla administration panel for website management.</span>
              </div>
            </a>
          </li>
        </ul>
      </section>
    </div>
  </template>

  <script src="js/gds-shell.js"></script>
</body>
</html>
