<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>QR code generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/gds-theme.css" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32x32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="favicon-16x16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
</head>
<body data-app-key="qr" data-app-title="QR code generator" data-app-intro="Enter text or a URL to generate a QR code you can scan or download.">
  <div id="app-shell"><p class="app-note">Loading Marketing Tools… If this message persists, refresh the page or contact Marketing.</p></div><noscript><p>This toolkit requires JavaScript to run.</p></noscript>

  <template id="app-page-content">
    <div class="app-panel" role="region" aria-labelledby="qr-panel-title">
      <h2 id="qr-panel-title" class="app-section-title">Create a new QR code</h2>
      <p class="page-description">Use a short, clear file name. QR codes are generated locally on your device.</p>

      <form novalidate>
        <div class="form-group">
          <label for="qrName">Name for this QR code</label>
          <p class="hint-text" id="qrNameHint">This will be used as the downloaded filename.</p>
          <input type="text" id="qrName" aria-describedby="qrNameHint" autocomplete="off" />
        </div>

        <div class="form-group">
          <label for="qrText">Text or URL</label>
          <p class="hint-text" id="qrHint">For example, <code>https://newbury-college.ac.uk</code> or any short piece of text.</p>
          <input type="text" id="qrText" aria-describedby="qrHint qrError" autocomplete="off" />
          <p id="qrError" class="error-message" aria-live="polite"></p>
        </div>

        <div class="button-row">
          <button type="submit" class="btn-primary" id="generateBtn">Generate QR code</button>
          <button type="button" class="btn-secondary" id="downloadBtn" disabled>Download QR code</button>
        </div>
      </form>

      <div class="qr-wrapper" aria-live="polite" aria-atomic="true">
        <img id="qrImage" alt="Generated QR code" />
        <p id="qrPlaceholder" class="qr-placeholder">The QR code preview will appear here after you generate it.</p>
        <p id="qrStatus" class="status-text"></p>
      </div>
    </div>
  </template>

  <script src="vendor/qrcode/qrcode.js"></script>
  <script src="js/shared-utils.js"></script>
  <script src="js/gds-shell.js"></script>
  <script src="js/qr.js"></script>
</body>
</html>
