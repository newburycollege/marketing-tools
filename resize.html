<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketing image resizer</title>
  <link rel="stylesheet" href="css/gds-theme.css" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32x32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="favicon-16x16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
</head>
<body data-app-key="resize" data-app-title="Marketing image resizer" data-app-intro="Upload one image and generate every required marketing size.">
  <div id="app-shell"><p class="app-note">Loading Marketing Tools… If this message persists, refresh the page or contact Marketing.</p></div><noscript><p>This toolkit requires JavaScript to run.</p></noscript>

  <template id="app-page-content">
    <form id="uploadForm" class="app-form">
      <h2 class="app-section-title">Resize one image into multiple formats</h2>
      <p class="page-description">Enter a base file name once and the app will apply it to every output automatically.</p>

      <div class="form-group">
        <label for="imageInput">Image file</label>
        <input type="file" id="imageInput" accept="image/*" required />
      </div>

      <div class="form-group">
        <label for="fileName">Base file name</label>
        <input type="text" id="fileName" placeholder="File Name" required />
      </div>

      <div class="app-button-row">
        <button type="submit">Resize all</button>
      </div>
    </form>

    <p id="resizeStatus" class="status-text" role="status"></p>
    <section id="resultsContainer" class="app-results" aria-labelledby="results-title">
      <table id="resultsTable">
        <thead>
          <tr>
            <th id="results-title">Image</th>
            <th>Description</th>
            <th>File name</th>
            <th>File size</th>
            <th>Download</th>
          </tr>
        </thead>
        <tbody id="resultsTbody"></tbody>
      </table>
    </section>

    <div class="app-actions">
      <button id="zipButton" type="button" disabled>Download all as ZIP</button>
    </div>
  </template>

  <script src="vendor/jszip/jszip.min.js"></script>
  <script src="js/shared-utils.js"></script>
  <script src="js/gds-shell.js"></script>
  <script src="js/resize.js"></script>
</body>
</html>
