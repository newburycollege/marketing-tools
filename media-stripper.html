<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Media Stripper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Remove supported metadata from video, audio and images locally, without re-encoding.">
  <link rel="stylesheet" href="css/gds-theme.css">
  <link rel="stylesheet" href="css/video-stripper.css">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32x32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="favicon-16x16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
</head>
<body data-app-key="media-stripper" data-app-title="Media Stripper" data-app-intro="Remove supported metadata from video, audio and image files without re-encoding the media.">
  <div id="app-shell"><p class="app-note">Loading Marketing Tools… If this message persists, refresh the page or contact Marketing.</p></div><noscript><p>This toolkit requires JavaScript to run.</p></noscript>
  <template id="app-page-content">
    <div class="app-note"><strong>Your media stays on this device.</strong> Files are processed in your browser, not uploaded. Use only files you are authorised to edit.</div>
    <section class="vs-panel" aria-labelledby="vs-heading">
      <h2 id="vs-heading">Choose media files</h2>
      <label id="vs-drop-zone" class="vs-drop-zone" for="vs-file-input" tabindex="0">
        <span class="vs-drop-zone__title">Drop MP4, MOV, M4V, MP3, JPG or PNG files here</span>
        <span class="vs-drop-zone__help">or select one or more files from this device</span>
        <input id="vs-file-input" type="file" multiple accept=".mp4,.mov,.m4v,.mp3,.jpg,.jpeg,.png,video/mp4,video/quicktime,audio/mpeg,image/jpeg,image/png">
      </label>
      <div id="vs-file-card" class="vs-file-card" hidden><div><strong id="vs-file-name"></strong><span id="vs-file-details"></span></div><button id="vs-change-file" class="gds-button gds-button--secondary" type="button">Choose files</button></div>
      <div class="vs-actions"><button id="vs-clean-button" class="gds-button" type="button" disabled>Strip metadata</button><button id="vs-cancel-button" class="gds-button gds-button--secondary" type="button" hidden>Cancel</button><button id="vs-reset-button" class="gds-button gds-button--secondary" type="button" disabled>Clear files</button></div>
      <div id="vs-status" class="vs-status vs-status--info" role="status">Select media files to begin.</div>
      <div id="vs-progress-wrap" class="vs-progress" hidden><div class="vs-progress__track" role="progressbar" aria-label="Batch progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="vs-progress-bar" class="vs-progress__bar"></div></div><span id="vs-progress-label"></span></div>
      <div id="vs-result" class="vs-result" hidden><h3>File results</h3><p>Check the removal and retention notes before publishing. Original files are unchanged.</p><div id="vs-results-list"></div><button id="vs-zip-button" type="button" class="gds-button" disabled>Download all as ZIP</button></div>
    </section>
    <details class="vs-details"><summary>Technical information and limitations</summary>
      <p><strong>Video:</strong> FFmpeg stream-copy remux removes inherited global metadata and chapters. Stream-level information, attachments and embedded metadata can be retained or excluded depending on format; the original is never overwritten. Some specialised tracks, including data tracks, are not copied. M4V outputs use MP4.</p>
      <p><strong>MP3:</strong> Recognised ID3, APE and Lyrics3v2 tags are removed without altering MPEG audio frames. Playback headers are retained. Unrecognised data and unsupported frame types are rejected.</p>
      <p><strong>JPEG and PNG:</strong> Recognised metadata is removed without recompressing the image. Orientation and colour profiles are retained where necessary; PNG rendering and animation chunks and unrecognised ancillary chunks are retained. Multi-picture JPEGs are rejected to prevent damage.</p>
      <p>Large files or batches may exceed browser memory. Process them in smaller batches or use a trusted desktop tool. This tool does not verify removal of all metadata or Content Credentials; inspect deliverables separately. Preserve originals and any required attribution or provenance.</p>
    </details>
  </template>
  <script src="js/shared-utils.js"></script>
  <script src="js/gds-shell.js"></script>
  <script src="js/media-metadata.js"></script>
  <script src="js/media-stripper.js"></script>
</body>
</html>
